name: App Store Build

# Manually-triggered build of the Mac App Store variant.
#
# Unlike release.yml (Developer ID + notarization for direct download), this job
# produces a sandboxed, universal `.app` signed with the *Apple Distribution*
# identity, wraps it in a `.pkg` signed with the *3rd Party Mac Developer
# Installer* identity, and uploads it to App Store Connect via the App Store
# Connect API key.
#
# The App Store overlay lives in src-tauri/tauri.appstore.conf.json, which adds
# the sandbox entitlements (Entitlements-AppStore.plist) and embeds the
# provisioning profile written below.
#
# Required secrets:
#   APPLE_TEAM_ID
#   APPLE_APPSTORE_CERTIFICATE / _PASSWORD   base64 "Apple Distribution" .p12 + pw
#   APPLE_APPSTORE_SIGNING_IDENTITY          e.g. "Apple Distribution: Name (TEAMID)"
#   APPLE_INSTALLER_CERTIFICATE / _PASSWORD  base64 "3rd Party Mac Developer Installer" .p12 + pw
#   APPLE_INSTALLER_SIGNING_IDENTITY         e.g. "3rd Party Mac Developer Installer: Name (TEAMID)"
#   APPLE_APPSTORE_PROVISION_PROFILE         base64 .provisionprofile
#   APPLE_API_KEY_ID / APPLE_API_ISSUER      App Store Connect API key id + issuer id
#   APPLE_API_KEY                            contents of the AuthKey_*.p8 (raw PEM text)

on:
  workflow_dispatch: {}

jobs:
  build-appstore:
    name: Build & upload to App Store Connect
    runs-on: macos-latest

    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      APPLE_APPSTORE_CERTIFICATE: ${{ secrets.APPLE_APPSTORE_CERTIFICATE }}
      APPLE_APPSTORE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_APPSTORE_CERTIFICATE_PASSWORD }}
      APPLE_APPSTORE_SIGNING_IDENTITY: ${{ secrets.APPLE_APPSTORE_SIGNING_IDENTITY }}

      APPLE_INSTALLER_CERTIFICATE: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
      APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
      APPLE_INSTALLER_SIGNING_IDENTITY: ${{ secrets.APPLE_INSTALLER_SIGNING_IDENTITY }}

      APPLE_APPSTORE_PROVISION_PROFILE: ${{ secrets.APPLE_APPSTORE_PROVISION_PROFILE }}

      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}

      KEYCHAIN_PASSWORD: temporary-ci-keychain-password

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: appstore-macos-universal

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare certificates
        run: |
          set -euo pipefail
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain

          echo "$APPLE_APPSTORE_CERTIFICATE" | base64 --decode > appstore.p12
          security import appstore.p12 \
            -k build.keychain \
            -P "$APPLE_APPSTORE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productbuild

          echo "$APPLE_INSTALLER_CERTIFICATE" | base64 --decode > installer.p12
          security import installer.p12 \
            -k build.keychain \
            -P "$APPLE_INSTALLER_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productbuild

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            build.keychain

          security find-identity -v -p codesigning
          rm -f appstore.p12 installer.p12

      - name: Prepare provisioning profile
        run: |
          set -euo pipefail
          mkdir -p src-tauri/profiles
          echo "$APPLE_APPSTORE_PROVISION_PROFILE" | base64 --decode \
            > src-tauri/profiles/Shellboard_Mac_App_Store.provisionprofile

      - name: Prepare App Store Connect API key
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPLE_API_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"

      - name: Build Tauri app for App Store (universal)
        env:
          # Tauri reads APPLE_SIGNING_IDENTITY to sign the .app during bundling.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_APPSTORE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          # Compile + lipo both archs (no bundle yet) so the universal bundle
          # below has the x86_64 slice to fold in.
          npm run tauri build -- --no-bundle --target universal-apple-darwin
          # Produce only the .app, applying the App Store overlay (sandbox
          # entitlements + embedded provisioning profile).
          npm run tauri bundle -- \
            --bundles app \
            --target universal-apple-darwin \
            --config src-tauri/tauri.appstore.conf.json

      - name: Create signed pkg
        run: |
          set -euo pipefail
          APP_PATH=$(find src-tauri/target -name "Shellboard.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Shellboard.app not found under src-tauri/target" >&2
            exit 1
          fi
          echo "APP_PATH=$APP_PATH"
          productbuild \
            --component "$APP_PATH" /Applications \
            --sign "$APPLE_INSTALLER_SIGNING_IDENTITY" \
            Shellboard.pkg

      - name: Validate pkg
        run: |
          set -euo pipefail
          xcrun altool --validate-app \
            --type macos \
            --file "Shellboard.pkg" \
            --apiKey "$APPLE_API_KEY_ID" \
            --apiIssuer "$APPLE_API_ISSUER"

      - name: Upload pkg to App Store Connect
        run: |
          set -euo pipefail
          xcrun altool --upload-app \
            --type macos \
            --file "Shellboard.pkg" \
            --apiKey "$APPLE_API_KEY_ID" \
            --apiIssuer "$APPLE_API_ISSUER"

      - name: Upload pkg as GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shellboard-AppStore-pkg
          path: Shellboard.pkg
