name: Release

# Triggered by tag push (e.g. `git tag v0.1.0 && git push origin v0.1.0`).
# Builds installable bundles for macOS (Apple Silicon) and Linux,
# then creates a DRAFT GitHub Release so you can review and publish manually.
#
# Windows is optional; enable it by adding `windows-latest` to the matrix.
#
# The draft release is created up-front in a single job; the matrix builds
# upload artifacts into it by `releaseId`. This avoids the race where two
# parallel matrix jobs both try to create the same tag and one gets a 5xx.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/checkout@v6

      # Extract the section for the tag's version from CHANGELOG.md so the
      # GitHub Release body shows what's in this version, followed by the
      # static install / Gatekeeper instructions. Strip the leading `v` from
      # the tag (v1.4.0 → 1.4.0) before matching.
      - name: Extract changelog notes
        id: notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=$(awk -v target="## [$version]" '
            index($0, target) == 1 { capturing=1; next }
            capturing && /^## \[/ { exit }
            capturing { print }
          ' CHANGELOG.md)
          {
            echo "body<<RELEASE_NOTES_EOF"
            if [ -n "$notes" ]; then
              echo "## What's new in ${GITHUB_REF_NAME}"
              echo
              echo "$notes"
            fi
            cat <<'STATIC'
          ### Install

          - **macOS (Apple Silicon)**: `Shellboard_*_aarch64.dmg` — open, drag into *Applications*.
          - **Linux (AppImage)**: `Shellboard_*.AppImage` — `chmod +x` and run.
          - **Linux (Debian/Ubuntu)**: `Shellboard_*_amd64.deb` — `sudo apt install ./Shellboard_*.deb`.

          ### macOS: unsigned-build notice

          This build isn't code-signed. On first launch macOS Gatekeeper will refuse to open it.

          - **Option 1** — right-click the app in *Applications* → **Open** → **Open anyway**.
          - **Option 2** — strip the quarantine attribute:
            ```sh
            xattr -cr /Applications/Shellboard.app
            ```

          After either step the app launches normally every time.
          STATIC
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create draft release
        id: create
        uses: actions/github-script@v7
        env:
          RELEASE_BODY: ${{ steps.notes.outputs.body }}
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Shellboard ${tag}`,
              body: process.env.RELEASE_BODY,
              draft: true,
              prerelease: false,
            });
            core.setOutput('release_id', data.id);

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
            label: "macOS (Apple Silicon)"
          - platform: ubuntu-22.04
            rust_target: ""
            args: ""
            label: "Linux"

    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: release-${{ matrix.platform }}-${{ matrix.rust_target }}

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev

      - name: Install npm deps
        run: npm ci

      - name: Build & upload release artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing is intentionally not wired here. Passing empty
          # APPLE_CERTIFICATE env vars makes the Tauri bundler try to run
          # `security import` on empty input and fail. When you later set
          # up a Developer ID cert, add the APPLE_CERTIFICATE /
          # APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY /
          # APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID env mappings here.
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
