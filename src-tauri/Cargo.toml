[package]
name = "shellboard"
version = "2.6.0"
description = "Cross-platform terminal with per-project tabs & splits"
authors = ["Petr Hložek <petr@petrhlozek.cz>"]
edition = "2024"

[lib]
name = "shellboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
uuid = { version = "1", features = ["v4"] }
# Process-table snapshots for the cross-platform "running apps" detector.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
which = "8"

# Same version Tauri already links; used to free F10 from the GTK menu bar.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
